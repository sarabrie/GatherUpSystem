<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>GatherUp - יצירת משתמש</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .logo { text-align: center; margin-bottom: 28px; }
        .logo h1 { font-size: 24px; color: #667eea; font-weight: 700; }
        label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
        input, select {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        input:focus, select:focus { outline: none; border-color: #667eea; }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.88; }
        .btn-primary { background: #667eea; color: white; margin-bottom: 12px; }
        .back { text-align: center; margin-top: 12px; font-size: 13px; color: #888; }
        .back a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <h1>יצירת משתמש חדש</h1>
        </div>
        <label>שם מלא</label>
        <input type="text" placeholder="הכנס שם מלא">
        <label>כתובת מייל</label>
        <input type="email" placeholder="example@mail.com">
        <label>שם משתמש</label>
        <input type="text" placeholder="בחר שם משתמש">
        <label>סיסמה</label>
        <input type="password" placeholder="בחר סיסמה">
        <button class="btn btn-primary">צור משתמש</button>
        <div class="back"><a href="login.html">← חזרה לכניסה</a></div>
    </div>
</body>
</html>
